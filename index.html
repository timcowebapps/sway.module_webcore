<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Serif&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./wwwroot/dist/css/libmodule.css">
  <title></title>
</head>

<body>
  <div id="root"></div>

  <script type="module">
    import create_webcore_module from "./bin/module_webcore_wasm_web_async.js";

    let moduleInstance = null;

    let instance = create_webcore_module({
      locateFile: function (path) {
        const baseURL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/"));
        return baseURL + '/bin/' + path;
      }
    });

    instance.then((module) => {
      moduleInstance = module;
      console.log("WASM module loaded successfully");

      console.log(moduleInstance);

      let updater = moduleInstance.createTreeNodeElementUpdater();

      let rootDescriptor = moduleInstance.createTreeNodeElementDescriptor({
        tagname: "div",
        id: "root",
        stylesheet: null,
			  classes: []
      });

      let root = moduleInstance.createTreeNodeElement(rootDescriptor);
      
      let wrapDescriptor = moduleInstance.createTreeNodeElementDescriptor({
        tagname: "div",
        id: "wrap",
        stylesheet: null,
			  classes: []
      });

      let wrap = moduleInstance.createTreeNodeElement(wrapDescriptor);
      wrap.addRegion("head", { id: "head_view", replace: true });
      root.addChildNode(wrap);
      wrap.traverse(updater);
      updater.forceUpdate();
    });

  </script>
</body>

</html>
