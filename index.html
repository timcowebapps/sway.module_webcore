<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Serif&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./wwwroot/dist/css/libmodule.css">
  <title></title>
</head>

<body>
  <header></header>
  <div id="wrap" class="content">
    <section class="section_product-hero"></section>
    <section class="section_product-content">
      <div class="horz-padding vert-padding-section-xsmall">
        <div class="container-xlarge">
          <div></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import create_webcore_module from "./bin/module_webcore_wasm_web_async.js";

    let moduleInstance = null;

    let instance = create_webcore_module({
      locateFile: function (path) {
        const baseURL = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/"));
        return baseURL + '/bin/' + path;
      }
    });

    instance.then((module) => {
      moduleInstance = module;
      console.log("WASM module loaded successfully");

      console.log(moduleInstance);
    });

  </script>
</body>

</html>
